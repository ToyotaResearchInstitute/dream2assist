# Dream2Assist Configuration File
#
# This file contains configurations for different training scenarios.
#
# PUBLIC CONFIGURATIONS (Box2D - Standalone):
#   - box2d_human_pass: Train human agent to pass ADOs
#   - box2d_human_left: Train human agent to pass on the left side
#   - box2d_human_right: Train human agent to pass on the right side
#   - box2d_ai: Train AI agent to infer human intent and provide assistance
#
# INTERNAL PLATFORM CONFIGURATIONS (EPIC Dynamics - Requires TRI Internal Access):
#   - epic_human_left, epic_human_right, epic_human_fast, epic_human_pass, epic_human_cautious
#   - epic_ai: AI agent trained with EPIC dynamics models
#
# CARLA CONFIGURATIONS (Requires CARLA Simulator):
#   - carla_human_pass, carla_human_stay, carla_ai

defaults:

  # ============================================================================
  # SYSTEM & INFRASTRUCTURE
  # ============================================================================
  logdir: null
  traindir: null
  evaldir: null
  offlinedir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  device: 'cuda'
  compile: True
  precision: 32
  debug: False

  # ============================================================================
  # EVALUATION & LOGGING
  # ============================================================================
  eval_every: 1e4
  eval_episode_num: 3
  log_every: 1e4
  reset_every: 0
  expl_gifs: False
  video_pred_log: false
  is_verbose: true  # If True, prints out the training progress.

  # These metrics are for wandb logging purpose
  ego_distance_threshold: 10  # Distance threshold within which AI action was steering in opposite direction
  ego_collision_course_distance_threshold: 15  # Distance threshold when ego is on a collision course with ado and AI action produced incorrect steering angle
  ego_collision_course_steering_angle_radian_threshold: 0.25  # Incorrect steering angle threshold produced by AI action

  # ============================================================================
  # ENVIRONMENT CONFIGURATION
  # ============================================================================
  task: 'racing_proprio_population'
  size: [64, 64]
  envs: 1
  action_repeat: 2
  time_limit: 1000
  grayscale: False
  prefill: 2500
  eval_noise: 0.0
  reward_EMA: True
  num_agents: 2  # number of vehicles on the road.
  render_box2d: True
  # render_bev: True
  bev_zoom_on_ego: True
  steps: 2e6
  dataset_size: 1000000

  # ============================================================================
  # TRACK & ASSET PATHS
  # ============================================================================
  track_csv: 'sdm_ws/src/dream2assist/dream2assist/dream2assist/assets/track.csv'
  track_map_process_csv: 'sdm_ws/src/dream2assist/dream2assist/dream2assist/assets/track_map_process.csv'

  # ============================================================================
  # AGENT CONFIGURATION
  # ============================================================================
  source_agent_id: 0  # If pct_population_play > 0 or human_ego_agent_paths are given, determines which agent to use as the source (pre-trained index).  For instance, when training with a human-only agent, there would only be one agent, so 0 would be the source.  0-indexed.
  frozen_agent_id: 1  # If pct_population_play > 0 or human_ego_agent_paths are given, determines which agent to freeze (supplant by the source agent).  For instance, when training in a multi-agent setup with an AI (0) and human (1), 1 would be the target.  0-indexed.
  pct_population_play: 0.0  # percentage of population play (previous checkpoints) to use.  0.0 means no population play, 1.0 means all population play.
  population_sample_bias: []  # If using population play, the probability of sampling each of the population agents, dimensions should agree with `human_ego_agent_paths`.  Should sum to 1.0.
  use_intent: False
  intent_head: 'binary'
  behavior_labels: []
  use_human_inference_reward: False  # Use a reward for maximizing inferred human type
  human_inference_reward_type: reward  # If `action`, bases the reward on the optimal human action; if `reward`, uses the optimal human reward; if `action_logprob`, uses the likelihood of the optimal human action.
  human_ego_agent_paths: []  # List of paths to human ego agent policy models. If given, overrides pct_population_play. If empty, previous checkpoints are used if pct_population_play > 0. On SageMaker, use 'logs/model_name' format (see epic_ai section for examples).
  use_human_model: False
  human_model_class: ""
  action_buffer_length: 0
  use_prior: False  # Keep this False.  The only use case for this being true is multi-step inference.
  use_latest_model_if_pop_or_human: False  # If True, uses the latest checkpoint for the population or human agent.  If False, uses all checkpoints.

  # ============================================================================
  # MODEL ARCHITECTURE
  # ============================================================================

  # Dynamics model
  dyn_cell: 'gru_layer_norm'
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_input_layers: 1
  dyn_output_layers: 1
  dyn_rec_depth: 1
  dyn_shared: False
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  dyn_temp_post: True

  # Encoder/Decoder
  encoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: 'LayerNorm', cnn_depth: 32, cnn_kernels: [4, 4, 4, 4], mlp_layers: 2, mlp_units: 512, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: 'LayerNorm', cnn_depth: 32, cnn_kernels: [4, 4, 4, 4], mlp_layers: 2, mlp_units: 512, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse,}

  # Network units and layers
  grad_heads: ['decoder', 'reward', 'cont', 'intent']
  units: 512
  reward_layers: 2
  cont_layers: 2
  value_layers: 2
  actor_layers: 2
  intent_layers: 2
  act: 'SiLU'
  norm: 'LayerNorm'

  # Heads
  value_head: 'symlog_disc'
  reward_head: 'symlog_disc'

  # Scales and gradients
  dyn_scale: '0.5'
  rep_scale: '0.1'
  kl_free: '1.0'
  cont_scale: 1.0
  reward_scale: 1.0
  intent_scale: 0.1
  weight_decay: 0.0
  unimix_ratio: 0.01
  action_unimix_ratio: 0.01
  initial: 'learned'

  # ============================================================================
  # TRAINING PARAMETERS
  # ============================================================================
  batch_size: 16
  batch_length: 64
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  value_lr: 3e-5
  actor_lr: 3e-5
  ac_opt_eps: 1e-5
  value_grad_clip: 100
  actor_grad_clip: 100
  slow_value_target: True
  slow_target_update: 1
  slow_target_fraction: 0.02
  opt: 'adam'

  # ============================================================================
  # BEHAVIOR & ACTOR CONFIGURATION
  # ============================================================================
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  imag_gradient: 'dynamics'
  imag_gradient_mix: '0.0'
  imag_sample: True
  actor_dist: 'normal'
  actor_entropy: '3e-4'
  actor_state_entropy: 0.0
  actor_init_std: 1.0
  actor_min_std: 0.1
  actor_max_std: 1.0
  actor_temp: 0.1
  expl_amount: 0.0
  eval_state_mean: False
  collect_dyn_sample: True
  behavior_stop_grad: True
  value_decay: 0.0
  future_entropy: False

  # ============================================================================
  # EXPLORATION
  # ============================================================================
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

  # ============================================================================
  # REWARD CONFIGURATION
  # ============================================================================

  # Collision Rewards
  use_collision_penalty: True  # If True, penalizes the ego car for colliding with the ado car.
  end_episode_on_collision: False  # If True, ends the episode if there is a collision.
  outer_coll_dist_threshold: 6.0  # Threshold to consider a near-collision with the ado car.
  inner_coll_dist_threshold: 3.0  # Threshold to consider a collision with the ado car.  Should be roughly 2x the car width, since we are making pointwise collision checks.
  outer_coll_penalty: 10000.0  # Penalty for entering outer threshold with ado car.
  inner_coll_penalty: 10000.0  # Penalty for entering inner threshold with ado car.

  # Boundary Rewards
  use_out_of_bounds_penalty: True  # If True, penalizes the ego car for going out of bounds.
  out_of_bounds_penalty: 10000.0  # Penalty for ego crossing a lane boundary.
  use_soft_bounds_penalty: True  # If True, penalizes the ego car for going close to out of bounds.
  soft_bounds_penalty_multiplier: 1000.0  # Penalty for ego getting close to a lane boundary.
  soft_bounds_penalty_threshold: 0.5  # Distance from lane boundary to start applying the soft out of bounds penalty.

  # Speed Rewards
  use_speed_penalty: True  # Use a penalty for going extremely slow.
  default_low_speed_penalty: 10.0  # Default penalty for going below the low speed threshold.
  additional_low_speed_penalty: 100.0  # Additional penalty for going below the low speed threshold, if use_speed_penalty is True.
  use_speed_bonus: True  # If True, gives a bonus for going fast when not colliding.
  speed_bonus_multiplier: 1.0  # Multiplier on vehicle speed for computing the stepwise speed bonus.
  use_near_ado_speed_penalty: False  # Use a penalty going fast when in close proximity of an ado.
  near_ado_speed_penalty_distance: 15.0  # Distance threshold for near ado speed penalty to kick in.
  near_ado_speed_penalty_multiplier: 2.0  # Multiplier on vehicle speed for computing the near ado speed penalty.

  # Action Penalties
  use_action_diff_penalty: False  # If True, penalizes the difference in actions between timesteps.
  max_steering_penalty: 20.0  # Maximum steering penalty if `use_action_diff_penalty` is True.
  steering_penalty_update_rate: 0.0002  # Rate (sec) at which the steering penalty increases.
  progress_threshold_for_steering_penalty: 0.0  # Progress threshold for steering penalty to kick in.
  ai_acts_penalty_multiplier: 0.0  # Multiplier for the AI agent's action penalty in the reward shaping.
  steer_action_is_derivative: False  # If True, the steer action is treated as a derivative of the steer action fed to the vehicle.
  # To handle the additional integral state, extends the observation space by one.
  penalize_steering_over_bounds: False  # if steer_action_is_derivative is True, penalizes the steering action if it goes over bounds.

  # Directional Bias Rewards
  use_left_bias_penalty: False  # If True, penalizes the agent for steering right (positive steering) when the ado is on the left, and vice versa.
  use_right_bias_penalty: False  # If True, penalizes the agent for steering left (negative steering) when the ado is on the right, and vice versa.
  left_right_bias_dist_threshold: 8.0  # Distance threshold for left/right bias penalty to kick in.
  left_right_bias_penalty: 0.0  # Penalty for left/right bias.
  left_right_penality_moving_ados_only: True  # If True, only applies the left/right bias penalty if the ado is moving.

  # Task-Specific Rewards
  reward_cap: 0.0  # Maximum reward allowed --> rewards = min(reward_cap, rewards)
  pass_range: 0.0  # Min / max distance for the passing reward to be activated
  pass_reward_scale: 0.0  # Amount to scale passing reward
  progress_reward_scale: 0.0  # Amount to scale the individual progress reward
  use_intent_specific_rewards_in_shaping: False  # If True, uses intent-specific rewards in the reward shaping.  Used to ablate the more general case where we simply use the intent-conditioned learned reward.

  # ============================================================================
  # CURRICULUM LEARNING
  # ============================================================================
  headstart_curriculum: False
  ado_speed_curriculum: False
  max_ado_headstart: 0.2  # How many seconds' headstart can the ado get? uniform in the range [0, max_ado_headstart].
  ado_speed_factor_lb: 0.5  # Factor on the ado's speed during training - lower bound on uniform sampling.
  ado_speed_factor_ub: 2.0  # Factor on the ado's speed during training - upper bound on uniform sampling.
  speed_factor_randomization_prob: 0.3  # Probability of randomizing the ado's speed factor.
  ado_trigger_radius_lb: 15  # Radius around ado rails to trigger the ado rails - lower bound on uniform sampling.
  ado_trigger_radius_ub: 40  # Radius around ado rails to trigger the ado rails - upper bound on uniform sampling.
  ado_slowdown_factor: 0.0  # Factor to slow down the ado during training.
  ado_update_rate: 0.0  # Rate (in terms of steps) at which the ADO headstart and/or speed factor increases in the training curriculum.

  # ============================================================================
  # ADO RAILS CONFIGURATION
  # ============================================================================
  use_demo_ado_rails: False  # If True, loads all skidpad demo ado rails for the ados.  If False, just load one file.
  rotate_ado_90degrees: False  # If True, rotates the ado rails by 90 degrees to match the Box2D coordinate system.
  use_pure_pursuit: False

  # ============================================================================
  # STATE REPRESENTATION
  # ============================================================================
  include_ego_position_in_state: False  # If True, includes the ego's (x, y) position in the observation state.
  use_relative_heading_in_state: True  # If True, uses the ego's heading relative to the track heading in the observation state.  If False, uses the ego's absolute heading.
  save_vehicle_dreamer_data: False  # If True, serializes the vehicle data for the dreamer model to file vehicle_dreamer_data_<timestamp>.pkl.

  # ============================================================================
  # NAVIGATION & CONTROL
  # ============================================================================
  use_race_line: False
  randomize_ego_start: False  # If True, randomizes the ego vehicle's start position within the track bounds at the start of each episode.
  pct_track_to_visit: 0.0  # If given, sets the terminate visit at least this fraction of the track to complete the episode.
  randomize_road_position: False
  road_offset_lateral: 5.0
  road_offset_angular: 0.3

# ==============================================================================
# BOX2D CONFIGURATIONS
# ==============================================================================

box2d_racing_human_pass:
  task: 'Box2dSharedRacingWrapper'

  # Track & Asset paths
  track_csv: 'sdm_ws/src/dream2assist/dream2assist/dream2assist/assets/track.csv'
  track_map_process_csv: 'sdm_ws/src/dream2assist/dream2assist/dream2assist/assets/track_map_process.csv'

  # Ado configuration
  ado_rails: 'sdm_ws/src/dream2assist/dream2assist/dream2assist/assets/grip_demo/ado_rails_5/'
  ado_names: ['ado0']  #, 'ado1', 'ado2', 'ado3', 'ado4']  # Names of the ados in the environment.
  num_agents: 6  # Number of vehicles on the road.  This includes the ego and the ados.
  use_demo_ado_rails: False
  use_pure_pursuit: True

  # Encoder/Decoder overrides
  encoder: {mlp_keys: '.*', cnn_keys: '$^'}
  decoder: {mlp_keys: '.*', cnn_keys: '$^'}

  # Navigation
  use_race_line: False
  randomize_ego_start: True  # If True, randomizes the ego vehicle's start position within the track bounds at the start of each episode.
  pct_track_to_visit: 0.8  # If given, sets the terminate visit at least this fraction of the track to complete the episode.

  # Agent configuration
  egocentric_agent_names: ['human']  # ordered name(s) of the egocentric agents.  Number of names will dictate the number of egocentric agents involved in controlling the ego.
  pct_population_play: 0.0  # percentage of population play (previous checkpoints) to use.  0.0 means no population play, 1.0 means all population play.
  use_intent: False
  use_human_inference_reward: False  # Use a reward for maximizing inferred human type
  human_inference_reward_type: reward  # If `action`, bases the reward on the optimal human action; if `reward`, uses the optimal human reward; if `action_logprob`, uses the likelihood of the optimal human action.
  human_ego_agent_paths: []  # List of paths to human ego agent policy models. If given, overrides pct_population_play. If empty, previous checkpoints are used if pct_population_play > 0. On SageMaker, use 'logs/model_name' format (see epic_ai section for examples).

  # Steering penalties
  progress_threshold_for_steering_penalty: 150.  # Progress threshold for steering penalty to kick in.
  steering_penalty_update_rate: 1 / 5000  # Rate at which the steering penalty increases.
  max_steering_penalty: 20.0  # Maximum steering penalty.
  ai_acts_penalty_multiplier: 1.0
  ado_slowdown_factor: 0.7
  ado_update_rate: 1/5000

  # Collision configuration
  use_collision_penalty: True
  end_episode_on_collision: False

  # Task rewards
  reward_cap: 1.5  # Maximum reward allowed --> rewards = min(reward_cap, rewards)
  pass_range: 800.0  # Min / max distance for the passing reward to be activated
  pass_reward_scale: 10  # Amount to scale passing reward
  progress_reward_scale: 1.0  # Amount to scale the individual progress reward

  # Curriculum settings
  headstart_curriculum: False
  ado_speed_curriculum: False

