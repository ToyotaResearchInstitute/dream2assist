carla_human_pass:
  # Platform-specific settings
  host: localhost
  port: 5000
  init_carla: True
  render_carla: False
  envs: 1
  multicar_racing_config_name: "sim_rosdemo"

  # Agent configuration
  egocentric_agent_names: ['human']  # ordered name(s) of the egocentric agents.  Number of names will dictate the number of egocentric agents involved in controlling the ego.
  pct_population_play: 0.0  # percentage of population play (previous checkpoints) to use.  0.0 means no population play, 1.0 means all population play.
  use_intent: False
  use_human_inference_reward: False  # Use a reward for maximizing inferred human type
  human_inference_reward_type: reward  # If `action`, bases the reward on the optimal human action; if `reward`, uses the optimal human reward; if `action_logprob`, uses the likelihood of the optimal human action.
  human_ego_agent_paths: []  # List of paths to human ego agent policy models. If given, overrides pct_population_play. If empty, previous checkpoints are used if pct_population_play > 0. On SageMaker, use 'logs/model_name' format (see epic_ai section for examples).

  # Steering penalties
  progress_threshold_for_steering_penalty: 150.  # Progress threshold for steering penalty to kick in.
  steering_penalty_update_rate: 1 / 5000  # Rate at which the steering penalty increases.
