  use_demo_ado_rails: True  # If True, loads all skidpad demo ado rails for the ados.  If False, just load one file.
  rotate_ado_90degrees: False  # If True, rotates the ado rails by 90 degrees to match the Box2D coordinate system.
  use_pure_pursuit: True

  # Encoder/Decoder overrides
  encoder: {mlp_keys: '.*', cnn_keys: '$^'}
  decoder: {mlp_keys: '.*', cnn_keys: '$^'}

  # Navigation
  use_race_line: False
  randomize_ego_start: True  # If True, randomizes the ego vehicle's start position within the track bounds at the start of each episode.
  pct_track_to_visit: 0.8  # If given, sets the terminate visit at least this fraction of the track to complete the episode.

  # Agent configuration
  egocentric_agent_names: ['ai', 'human']  # ordered name(s) of the egocentric agents.  Number of names will dictate the number of egocentric agents involved in controlling the ego.
  pct_population_play: 1.0  # percentage of population play (previous checkpoints) to use.  0.0 means no population play, 1.0 means all population play.
  use_intent: True
  use_human_inference_reward: True  # Use a reward for maximizing inferred human type.
  human_inference_reward_type: reward  # If `action`, bases the reward on the optimal human action; if `reward`, uses the optimal human reward; if `action_logprob`, uses the likelihood of the optimal human action.
  # human_ego_agent_paths: List of paths to human ego agent policy models.
  # IMPORTANT PATH SPECIFICATION:
  # - On SageMaker: Paths are relative to /opt/ml/code/
  # - Models from S3 are downloaded to /opt/ml/code/logs/ by download_s3_artifacts.py
  # - Example: To use model from s3://.../epic_model/foo/, specify 'logs/foo'
  #   - S3 location: s3://bucket/epic_model/foo/
  #   - Downloaded to: /opt/ml/code/logs/foo/
  #   - Config entry: 'logs/foo'
  #   - Resolved path: /opt/ml/code/logs/foo/
  # - The base directory name (e.g., 'foo') is matched against S3 directory listings
  human_ego_agent_paths: [
    'logs/epic_human_left_carousel_straight_186',
    'logs/epic_human_right_carousel_straight_186',
    'logs/epic_human_fast_carousel_straight_2',
    ]
  # population_sample_bias: [0.7, 0.3]  # If using population play, the probability of sampling each of the population agents, dimensions should agree with `human_ego_agent_paths`.  Should sum to 1.0.
  population_sample_bias: [0.462, 0.198, 0.34]  # If using population play, the probability of sampling each of the population agents, dimensions should agree with `human_ego_agent_paths`.  Should sum to 1.0.
  # Note: the order of the population_sample_bias corresponds to the order of the human_ego_agent_paths.
  # behavior_labels: ["cautious", "pass"]
  behavior_labels: ["left", "right", "fast"]
  intent_head: 'onehot'

  # Steering penalties
  progress_threshold_for_steering_penalty: 150.  # Progress threshold for steering penalty to kick in.
  steering_penalty_update_rate: 1 / 5000  # Rate at which the steering penalty increases.
  max_steering_penalty: 20.0  # Maximum steering penalty.
  ai_acts_penalty_multiplier: 5000.0  # Multiplier for the AI agent's action penalty in the reward shaping.

  # Speed configuration
  use_speed_penalty: True  # Use a penalty for going too slow.
  default_low_speed_penalty: 50.0  # Default penalty for going below the low speed threshold.
  speed_bonus_multiplier: 10.0  # Multiplier on vehicle speed for computing the stepwise speed bonus.
  use_near_ado_speed_penalty: False  # Use a penalty going fast when in close proximity of an ado, for fine tuning longitudinal behavior near ados.
  near_ado_speed_penalty_distance: 10.0  # Distance threshold for near ado speed penalty to kick in.
  near_ado_speed_penalty_multiplier: 30.0  # Multiplier on vehicle speed for computing the near ado speed penalty.

  # Collision configuration
  use_collision_penalty: False  # If True, penalizes the ego car for colliding with the ado car
  end_episode_on_collision: False  # If True, ends the episode if there is a collision.

  # Directional bias
  left_right_bias_dist_threshold: 8.0  # Distance threshold for left/right bias penalty to kick in.
  left_right_bias_penalty: 1000.0  # Penalty for left/right bias.

  # Task rewards
  use_intent_specific_rewards_in_shaping: True  # If True, uses intent-specific rewards in the reward shaping.  Used to ablate the more general case where we simply use the intent-conditioned learned reward.

  # Road randomization
  randomize_road_position: True
  road_offset_lateral: 5.0
  road_offset_angular: 0.3

