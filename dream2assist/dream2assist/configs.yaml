  ado_update_rate: 1/5000  # Rate (in terms of steps) at which the ADO headstart and/or speed factor increases in the training curriculum.

  # Task rewards
  reward_cap: 1.5  # Maximum reward allowed --> rewards = min(reward_cap, rewards)
  pass_range: 800.0  # Min / max distance for the passing reward to be activated
  pass_reward_scale: 10  # Amount to scale passing reward
  progress_reward_scale: 1.0  # Amount to scale the individual progress reward

  # Curriculum settings
  speed_factor_randomization_prob: 0.3  # Probability of dropping the speed factor to factors seen earlier in the training curriculum.

